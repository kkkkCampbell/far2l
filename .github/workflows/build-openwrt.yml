name: Build far2l for OpenWrt 25.12 (filogic)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'openwrt/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare package directory
        run: |
          # Копируем твой пакет far2l в стандартную директорию package/ внутри SDK-окружения
          # (предполагая, что в репозитории он лежит в openwrt/far2l)
          mkdir -p package/far2l
          cp -r openwrt/far2l/* package/far2l/

      - name: Build far2l
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: aarch64_cortex-a53-25.12.2
          PACKAGES: far2l
          VERSION: ${{ github.sha }}
          GIT_DATE: ${{ github.event.head_commit.timestamp }}
          GIT_HASH: ${{ github.sha }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: far2l-filogic-25.12.2
          path: |
            bin/packages/**/*.apk
            bin/packages/**/*.ipk
          if-no-files-found: error

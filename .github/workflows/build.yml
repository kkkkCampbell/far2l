name: Build far2l for OpenWrt 25.12 (filogic)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'far2l-openwrt/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build far2l
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: aarch64_cortex-a53-25.12.2
          FEEDNAME: far2l_ci
          PACKAGES: far2l-openwrt
          VERSION: ${{ github.sha }}
          GIT_DATE: ${{ github.event.head_commit.timestamp }}
          GIT_HASH: ${{ github.sha }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: far2l-filogic-25.12.2
          path: bin/packages/aarch64_cortex-a53/far2l_ci/*.apk
          if-no-files-found: error
